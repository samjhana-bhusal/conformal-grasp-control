# ── Simulation ────────────────────────────────────────────────────
# Recycling sorting: UR5 picks waste items, classifies, and sorts
# into recyclable (blue), compost (green), or landfill (black) bins.
simulation:
  table_height: 0.4
  n_objects: 6
  render_width: 640
  render_height: 480
  bin_width: 0.15
  bin_depth: 0.12

# ── RL Training ──────────────────────────────────────────────────
# Design decision: PPO with conservative hyperparameters.
# Rationale: manipulation tasks have high-variance gradients due to
# contact dynamics. Asymmetric reward: contamination (-20) >> missed value (-2).
training:
  algorithm: ppo
  total_timesteps: 200000
  n_steps_per_update: 1024
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  n_epochs: 10
  batch_size: 64
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  save_interval: 10  # save checkpoint every N updates

# ── Safety Gate ──────────────────────────────────────────────────
safety:
  alpha: 0.10          # target: 90% success rate
  delta: 0.05          # confidence level for Clopper-Pearson bound
  n_candidates: 100    # threshold grid resolution
  calibration_trials: 200

# ── Evaluation ───────────────────────────────────────────────────
evaluation:
  n_eval_episodes: 50
  render_video: true
  video_fps: 15
